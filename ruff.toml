# Ruff config for the rosetta workspace (adapted from ~/pai_ws).
# Lint + format: ruff-format adopted July 2026 (one-time ~95-file sweep,
# landed with the contract/frames/robots/policies restructure).
indent-width = 4
line-length = 120
target-version = "py312"

[lint]
# Matches _, __, and _var but not _var_
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
fixable = ["ALL"]
ignore = [
  # pai baseline
  "D203",
  "D400",
  "D401",
  "D415",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "RUF012",
  # rosetta additions
  "D100",    # undocumented modules/classes/functions: not required (yet)
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D107",
  "D212",    # summary position: this codebase puts it on the second line
  "D213",
  "PLC0415", # imports inside functions ARE the backend plugin architecture
  "PLR2004", # magic-value comparisons: dimension checks (quaternion == 4,
             # stereo == 2) and keycodes read clearer inline than as constants
]
select = ["E", "W", "F", "I", "B", "D", "RET", "RUF", "PL", "PIE", "FLY"]
unfixable = []

[lint.isort]
# Pinned because isort's first-party detection is cwd-dependent: each package's
# CI runs `ruff check .` from the package root (where `rosetta/` is a local
# directory -> first-party), while `pixi run lint` runs from the workspace root
# (where it is not -> third-party). Without this, the two disagree about import
# order and CI fails on I001 for files that lint clean locally.
known-first-party = [
  "rosetta",
  "rosetta_interfaces",
  "lerobot_rosetta",
  "lerobot_robot_rosetta",
  "lerobot_teleoperator_rosetta",
  "rerun_rosetta",
]
# Pinned for the mirror-image reason: `rosetta/launch/` is a real directory, so
# from the package root ruff reads the ROS `launch` package as a local module.
# These are always third-party, wherever ruff is invoked from.
known-third-party = [
  "launch",
  "launch_ros",
  "launch_testing",
  "launch_testing_ros",
]

[lint.per-file-ignores]
# Tests: docstrings optional; pytest.raises(match=...) substring-regexes are
# intentional (RUF043)
"**/test/**" = ["D", "RUF043"]
"**/tests/**" = ["D", "RUF043"]
