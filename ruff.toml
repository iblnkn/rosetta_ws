# Ruff config for the workspace's own Python (scripts/) and the private
# adapter repos under src/action/ that have no ruff.toml of their own. The
# rosetta repo's config is the source of truth: files inside src/action/rosetta
# use it directly (ruff picks the nearest config), and everything else extends it.
extend = "src/action/rosetta/ruff.toml"

[lint.isort]
# Replaces the rosetta list (isort settings don't merge), adding the private
# adapters so their imports sort the same here as in their own CI.
known-first-party = [
  "rosetta",
  "rosetta_ros",
  "rosetta_interfaces",
  "rosetta_ros_hil",
  "lerobot_rosetta",
  "lerobot_robot_rosetta",
  "lerobot_teleoperator_rosetta",
  "starvla_rosetta",
  "vla_foundry_rosetta",
]

[lint.extend-per-file-ignores]
# The rosetta patterns resolve against the rosetta repo, so restate them here.
"**/test/**" = ["D", "RUF043"]
"**/tests/**" = ["D", "RUF043"]
